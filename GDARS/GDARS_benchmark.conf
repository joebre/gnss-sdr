; GDARS_benchmark.conf -- benchmarking config for the new GDARS_Signal_Source,
; to compare CPU cost against the EVK1029 HW live source (see ../EVK1029/).
;
; Raw channel layout matches the request this was built from:
;   CH0 = E5  (wideband, split into E5a + E5b -> rf_out 0,1)
;   CH1 = L2  (disabled in this example)
;   CH2 = L1/E1 (wideband, split into E1 + GLONASS L1 + BeiDou B1 -> rf_out 2,3,4)
;   CH3 = E6  (direct, no translation needed -> rf_out 5)
;
; *** PLACEHOLDER VALUES ***: ch<N>_fs, rf_out<N>_IF, _bw, _decimation_factor
; below are illustrative, not measured against a real GDARS capture -- there
; was no sample file available while writing this. Adjust them to the actual
; recorded sample rates / IF offsets before using this for real benchmarking.
; Everything else (block wiring, RF_channel_ID mapping, the Galileo E1/E5a/E6
; and GPS L1 acquisition/tracking parameters) is reused as-is from the
; EVK1029 confs in ../EVK1029/, which ARE real, already-working values.

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.num_sources              = 1
; Pick each enabled channel's rf_out<N>_decimation_factor so that
; ch<N>_fs / decimation_factor comes out the same for every port below --
; GNSS-SDR.internal_fs_sps is a single global value shared by every
; Acquisition/Tracking block, same constraint EVK1029's dual-band config
; already has to satisfy (see EVK1029_Galileo_GPS_E1_E5a.conf: both bands
; use decimation_factor=8 off a shared 177.5 Msps raw rate).
GNSS-SDR.internal_fs_sps          = 10230000
GNSS-SDR.observable_interval_ms   = 1000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource0.implementation = GDARS_Signal_Source
SignalSource0.filename       = /path/to/gdars_capture.rec

SignalSource0.ch0_en      = true
SignalSource0.ch0_fs      = 81840000   ; PLACEHOLDER: CH0's own raw/native sample rate
SignalSource0.ch0_rf_out  = 2          ; -> rf_out 0 (E5a), rf_out 1 (E5b)

SignalSource0.ch1_en      = false

SignalSource0.ch2_en      = true
SignalSource0.ch2_fs      = 40920000   ; PLACEHOLDER
SignalSource0.ch2_rf_out  = 3          ; -> rf_out 2 (E1), rf_out 3 (GLONASS L1), rf_out 4 (BeiDou B1)

SignalSource0.ch3_en      = true
SignalSource0.ch3_fs      = 10230000   ; PLACEHOLDER -- already at E6 baseband, so decimation stays 1
SignalSource0.ch3_rf_out  = 1          ; -> rf_out 5 (E6, direct)

; rf_out 0: E5a, extracted from CH0's wideband E5 capture
SignalSource0.rf_out0_enable_freq_xlating = true
SignalSource0.rf_out0_window              = kaiser
SignalSource0.rf_out0_attenuation_dB      = 41.3
SignalSource0.rf_out0_IF                  = -15345000  ; PLACEHOLDER: E5a offset within CH0
SignalSource0.rf_out0_bw                  = 10000000
SignalSource0.rf_out0_tw                  = 4000000
SignalSource0.rf_out0_decimation_factor   = 8

; rf_out 1: E5b, extracted from CH0's wideband E5 capture
SignalSource0.rf_out1_enable_freq_xlating = true
SignalSource0.rf_out1_window              = kaiser
SignalSource0.rf_out1_attenuation_dB      = 41.3
SignalSource0.rf_out1_IF                  = 15345000   ; PLACEHOLDER: E5b offset within CH0
SignalSource0.rf_out1_bw                  = 10000000
SignalSource0.rf_out1_tw                  = 4000000
SignalSource0.rf_out1_decimation_factor   = 8

; rf_out 2: Galileo E1 / GPS L1, extracted from CH2's wideband L1/E1 capture
SignalSource0.rf_out2_enable_freq_xlating = true
SignalSource0.rf_out2_window              = kaiser
SignalSource0.rf_out2_attenuation_dB      = 41.3
SignalSource0.rf_out2_IF                  = 0           ; PLACEHOLDER: CH2 centered on L1/E1
SignalSource0.rf_out2_bw                  = 8000000
SignalSource0.rf_out2_tw                  = 3000000
SignalSource0.rf_out2_decimation_factor   = 4

; rf_out 3: GLONASS L1, extracted from CH2's wideband L1/E1 capture
SignalSource0.rf_out3_enable_freq_xlating = true
SignalSource0.rf_out3_window              = kaiser
SignalSource0.rf_out3_attenuation_dB      = 41.3
SignalSource0.rf_out3_IF                  = -4847000    ; PLACEHOLDER: GLONASS L1 offset within CH2
SignalSource0.rf_out3_bw                  = 8000000
SignalSource0.rf_out3_tw                  = 3000000
SignalSource0.rf_out3_decimation_factor   = 4

; rf_out 4: BeiDou B1, extracted from CH2's wideband L1/E1 capture
SignalSource0.rf_out4_enable_freq_xlating = true
SignalSource0.rf_out4_window              = kaiser
SignalSource0.rf_out4_attenuation_dB      = 41.3
SignalSource0.rf_out4_IF                  = 14322000    ; PLACEHOLDER: BeiDou B1 offset within CH2
SignalSource0.rf_out4_bw                  = 8000000
SignalSource0.rf_out4_tw                  = 3000000
SignalSource0.rf_out4_decimation_factor   = 4

; rf_out 5: E6, CH3 is already at E6 baseband -- direct, no translation.
SignalSource0.rf_out5_enable_freq_xlating = false

;######### SIGNAL_CONDITIONER CONFIG ############
; One per rf_out (getRfChannels() == 6); all Bypass, same as EVK1029's
; freq_xlating confs -- GDARS_Signal_Source already hands out
; decimated, frequency-translated gr_complex, so there's nothing left for
; a conditioner to do.
SignalConditioner0.implementation = Bypass
SignalConditioner1.implementation = Bypass
SignalConditioner2.implementation = Bypass
SignalConditioner3.implementation = Bypass
SignalConditioner4.implementation = Bypass
SignalConditioner5.implementation = Bypass

;######### CHANNELS GLOBAL CONFIG ############
Channels.in_acquisition = 8

Channels_1B.count = 8  ; Galileo E1, rf_out 2
Channels_5X.count = 8  ; Galileo E5a, rf_out 0
Channels_7X.count = 8  ; Galileo E5b, rf_out 1
Channels_1C.count = 8  ; GPS L1, rf_out 2
Channels_E6.count = 8  ; Galileo E6, rf_out 5
; TODO: add Channels_3G (GLONASS L1, rf_out 3) and Channels_B1 (BeiDou B1I,
; rf_out 4) once their Acquisition_3G/Tracking_3G and Acquisition_B1/
; Tracking_B1 blocks below are filled in with validated parameters -- none
; were available in this tree to reuse, unlike the Galileo/GPS/E6 blocks.

Channels_1B.RF_channel_ID = 2
Channels_1C.RF_channel_ID = 2
Channels_5X.RF_channel_ID = 0
Channels_7X.RF_channel_ID = 1
Channels_E6.RF_channel_ID = 5

;######### ACQUISITION CONFIG ############
; Reused as-is from EVK1029_Galileo_GPS_E1_E5a_E6_fast.conf (already
; working values) -- only RF_channel_ID above changes which rf_out port
; each signal reads from.
Acquisition_1B.implementation                      = Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.full_grid_search                    = true
Acquisition_1B.acquire_pilot                        = true
Acquisition_1B.item_type                            = gr_complex
Acquisition_1B.coherent_integration_time_ms         = 4
Acquisition_1B.doppler_max                          = 5000
Acquisition_1B.doppler_step                         = 125
Acquisition_1B.max_dwells                           = 5
Acquisition_1B.pfa                                  = 1e-7
Acquisition_1B.cboc                                 = true

Acquisition_5X.implementation                       = Galileo_E5a_Pcps_Acquisition
Acquisition_5X.full_grid_search                     = true
Acquisition_5X.item_type                            = gr_complex
Acquisition_5X.coherent_integration_time_ms         = 1
Acquisition_5X.doppler_max                          = 3740
Acquisition_5X.doppler_step                         = 500
Acquisition_5X.max_dwells                           = 20
Acquisition_5X.pfa                                  = 1e-7

Acquisition_1C.implementation                       = GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.full_grid_search                     = true
Acquisition_1C.item_type                            = gr_complex
Acquisition_1C.coherent_integration_time_ms         = 1
Acquisition_1C.doppler_max                          = 5000
Acquisition_1C.doppler_step                         = 500
Acquisition_1C.max_dwells                           = 20
Acquisition_1C.pfa                                  = 1e-8

Acquisition_E6.implementation                       = Galileo_E6_PCPS_Acquisition
Acquisition_E6.full_grid_search                     = true
Acquisition_E6.item_type                            = gr_complex
Acquisition_E6.coherent_integration_time_ms         = 1
Acquisition_E6.doppler_max                          = 3410
Acquisition_E6.doppler_step                         = 500
Acquisition_E6.max_dwells                           = 20
Acquisition_E6.pfa                                  = 1e-7

; TODO: Acquisition_7X (Galileo E5b, rf_out 1), Acquisition_3G (GLONASS L1,
; rf_out 3), Acquisition_B1 (BeiDou B1I, rf_out 4).

;######### TRACKING CONFIG ############
Tracking_1B.implementation           = Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type                = gr_complex
Tracking_1B.carrier_aiding           = true
Tracking_1B.pll_bw_hz                = 10.0
Tracking_1B.dll_bw_hz                = 2.0
Tracking_1B.track_pilot              = true
Tracking_1B.early_late_space_chips   = 0.15

Tracking_5X.implementation           = Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.item_type                = gr_complex
Tracking_5X.carrier_aiding           = true
Tracking_5X.pll_bw_hz                = 10.0
Tracking_5X.dll_bw_hz                = 2.0
Tracking_5X.track_pilot              = true
Tracking_5X.early_late_space_chips   = 0.2

Tracking_1C.implementation           = GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type                = gr_complex
Tracking_1C.carrier_aiding           = true
Tracking_1C.pll_bw_hz                = 10.0
Tracking_1C.dll_bw_hz                = 2.0

Tracking_E6.implementation           = Galileo_E6_DLL_PLL_Tracking
Tracking_E6.item_type                = gr_complex
Tracking_E6.carrier_aiding           = true
Tracking_E6.track_pilot              = true

; TODO: Tracking_7X, Tracking_3G, Tracking_B1.

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1B.implementation = Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_5X.implementation = Galileo_E5a_Telemetry_Decoder
TelemetryDecoder_1C.implementation = GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_E6.implementation = Galileo_E6_Telemetry_Decoder
; TODO: TelemetryDecoder_7X, TelemetryDecoder_3G, TelemetryDecoder_B1.

;######### OBSERVABLES CONFIG ############
Observables.implementation = Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation       = RTKLIB_PVT
PVT.elevation_mask        = 10
PVT.dynamics_model        = 0
PVT.output_rate_ms        = 1000
PVT.display_rate_ms       = 1000
PVT.output_enabled        = true
PVT.iono_model            = Iono-Free-LC
PVT.trop_model            = Saastamoinen

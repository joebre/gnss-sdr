;######### TRACKING GLOBAL CONFIG ############
; FLL frequency discriminator is a wrapped ATAN delta phase discriminator. Whith T=4 ms has a capture range of 1/4T = 62.5 Hz. 
; Galileo E1 acquisition may correlate over bit/second code boundary. In this case power shifts to lateral frequency bins. 
; To guarantee that signals are passed from Acquisition to thraking with a frequency error suitable for the frequency discriminator 
; (or even worst, compatible with the phase discriminator ;capture range) a sequential dopler scan phase must be performed.
; This reduces the frequency error down to what the FLL/PLL loop can handle.
; FLL tracking treshold: 3-sigma_FLL <=  1/4T 
; PLL tracking treshold: 3-sigma_PLL <=  20 deg

Tracking_1B.implementation                     = Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type                          = gr_complex
Tracking_1B.fll_bw_hz                          = 10.0; (T=4-ms; the 1-sigma jitter stays below 20-Hz  @ 30-dB-Hz)
Tracking_1B.pll_bw_hz                          = 10.0; (T=4-ms; the 1-sigma jitter stays below 15 deg @ 30 dB-HZ)
Tracking_1B.dll_bw_hz                          = 2.0;  (T=4-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz, fast convergence)
Tracking_1B.pll_bw_narrow_hz                   = 5.0;  (T=20-ms; the 1-sigma jitter stays below 15 deg @ 30 dB-HZ; jerk > 10 g/s)
Tracking_1B.dll_bw_narrow_hz                   = 0.5;  (T=20-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz)
Tracking_1B.enable_fll_pull_in                 = true
Tracking_1B.enable_fll_steady_state            = false
Tracking_1B.track_pilot                        = true
Tracking_1B.carrier_aiding                     = true
Tracking_1B.early_late_space_chips             = 0.15
Tracking_1B.very_early_late_space_chips        = 0.6
Tracking_1B.very_early_late_space_narrow_chips = 0.30
Tracking_1B.extend_correlation_symbols         = 5
Tracking_1B.f_error_step_num                   = 9 
Tracking_1B.f_error_accumulation               = 5; 20 ms
Tracking_1B.f_error_doppler_step               = 31;62.5; (1/2T)
;Tracking_1B.f_error_dump_filename              = f_error_dump_filename_Galileo.csv
;Tracking_1B.dump                               = true
;Tracking_1B.dump_filename                      = trk_galileoE1_ch

Tracking_5X.implementation                     = Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.item_type                          = gr_complex
Tracking_5X.fll_bw_hz                          = 10.0; (T=1-ms; the 1-sigma jitter stays below 10-Hz  @ 30-dB-Hz)
Tracking_5X.pll_bw_hz                          = 10.0; (T=1-ms; the 1-sigma jitter stays well below 15 deg @ 30 dB-HZ)
Tracking_5X.dll_bw_hz                          = 2.0;  (T=1-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz, fast convergence)
Tracking_5X.pll_bw_narrow_hz                   = 5.0;  (T=20-ms; the 1-sigma jitter stays significantly below 15 deg @ 30 dB-HZ; jerk > 10 g/s)
Tracking_5X.dll_bw_narrow_hz                   = 0.5;  (T=20-ms; typ. significantly below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz)
Tracking_5X.enable_fll_pull_in                 = true;
Tracking_5X.enable_fll_steady_state            = false
Tracking_5X.extend_correlation_symbols         = 20; extend to 20 ms
Tracking_5X.track_pilot                        = true
Tracking_5X.early_late_space_chips             = 0.2


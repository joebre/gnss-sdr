; Runtime satellite-visibility-aware acquisition search (default: disabled,
; legacy single-FIFO search order). When enabled, the acquisition search
; queue is split into "visible" (confidently above the horizon, from the
; live PVT fix or -- before the first fix -- the AGNSS_ref_location below)
; and "maybe visible" (no ephemeris/almanac yet, or below the horizon), and
; re-evaluated continuously as any of five conditions holds: the fix just
; became valid; ephemeris/almanac for some PRN arrived or was updated;
; visibility_recompute_interval_s of receiver time elapsed (satellites move
; negligibly over 1-5 min, so this is just a slow fallback, not the main
; driver); the receiver moved more than visibility_recompute_position_
; threshold_m since the last recompute; or the freshest data behind the
; current classification aged past its staleness threshold -- RTKLIB's own
; per-system MAXDTOE/MAXDTOE_GAL/MAXDTOE_BDS constants for ephemeris,
; visibility_almanac_max_age_s for almanac (expired data reverts that
; satellite to "maybe visible" rather than staying classified off stale
; orbital data).

GNSS-SDR.enable_visibility_aware_search      = true
; Visible-satellite picks per 1 maybe-visible pick in the search order.
GNSS-SDR.visible_vs_mayvisible_search_ratio  = 10
; Slow-fallback periodic recompute, in receiver-time seconds -- not the main
; trigger, see above.
GNSS-SDR.visibility_recompute_interval_s = 120.0
; Force a recompute once the receiver has moved this far (meters, ECEF)
; since the last one, independent of the interval above.
GNSS-SDR.visibility_recompute_position_threshold_m = 1000.0
; Half-window (seconds) around toa before almanac is treated as stale. Keep
; well under 302400 (half a week) -- toa is seconds-of-week, so ages can't
; be told apart unambiguously beyond that. Ephemeris staleness has no
; equivalent parameter: it's checked against RTKLIB's own per-system
; MAXDTOE/MAXDTOE_GAL/MAXDTOE_BDS constants unconditionally.
GNSS-SDR.visibility_almanac_max_age_s = 259200.0
GNSS-SDR.search_elevation_mask        = 10

; Caps how many times per second any single PRN+signal can be handed out for
; a fresh acquisition attempt (0 = disabled/unlimited, prior behavior). With
; few entries in a signal's visible bucket, a satellite that fails
; acquisition immediately can otherwise be re-handed to the next idle
; channel on every ~10 Hz idle tick, and with many idle channels polling
; that adds up to hundreds of repeat attempts per second on the same PRN
; for no benefit. 5 = at most once every 200 ms per PRN+signal.
GNSS-SDR.acquisition_max_retry_rate_hz = 5


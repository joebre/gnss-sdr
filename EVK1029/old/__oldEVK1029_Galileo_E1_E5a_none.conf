[GNSS-SDR]
;ControlThread.wait_for_flowgraph = false

;######### GLOBAL OPTIONS ##################
GNSS-SDR.num_sources               = 1
GNSS-SDR.internal_fs_sps           = 17750000; internal working rate after decimation
GNSS-SDR.telecommand_enabled       = true
GNSS-SDR.telecommand_tcp_port      = 3333
GNSS-SDR.osnma_enable              = false
GNSS-SDR.observable_interval_ms    = 1000
GNSS-SDR.assist_dual_frequency_acq = true 

; Currentely unavailable Galileo PRNs
GNSS-SDR.Galileo_banned_prns = 1,14,18,22

; Aiding
GNSS-SDR.AGNSS_XML_enabled       = true
GNSS-SDR.AGNSS_ref_location      = 46.012965,8.907565
GNSS-SDR.AGNSS_ref_utc_time      = 11/08/2026 12:10:48.000000    
GNSS-SDR.AGNSS_gal_ephemeris_xml = ../EVK1029/live_gal_ephemeris.xml  
GNSS-SDR.AGNSS_gal_iono_xml      = ../EVK1029/live_gal_iono.xml
GNSS-SDR.AGNSS_gal_utc_model_xml = ../EVK1029/live_gal_utc_model.xml
GNSS-SDR.AGNSS_gal_almanac_xml   = ../EVK1029/live_gal_almanac.xml
GNSS-SDR.AGNSS_gps_ephemeris_xml = ../EVK1029/live_gps_ephemeris.xml  
GNSS-SDR.AGNSS_gps_iono_xml      = ../EVK1029/live_gps_iono.xml 
GNSS-SDR.AGNSS_gps_utc_model_xml = ../EVK1029/live_gps_utc_model.xml
GNSS-SDR.AGNSS_gps_almanac_xml   = ../EVK1029/live_gps_almanac.xml

;######### SIGNAL_SOURCE CONFIG ############
SignalSource0.implementation           = EVK1029_Signal_Source
SignalSource0.filename                 = /mnt/DataDisk/Record_live1.rec
SignalSource0.sampling_frequency       = 177500000
SignalSource0.RF_channels              = 2
;SignalSource0.dump                    = true
;SignalSource0.dump_filename           = ./evk1029_signal_source.dat

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner0.implementation = Signal_Conditioner
SignalConditioner1.implementation = Signal_Conditioner

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter0.implementation = Pass_Through
DataTypeAdapter0.item_type      = byte
DataTypeAdapter1.implementation = Pass_Through
DataTypeAdapter1.item_type      = byte

;######### INPUT_FILTER CONFIG ############
; RF CHANNEL 0 -> extracts band at IF0
InputFilter0.implementation     = Freq_Xlating_Fir_Filter
InputFilter0.input_item_type    = byte
InputFilter0.output_item_type   = gr_complex
InputFilter0.taps_item_type     = float
InputFilter0.sampling_frequency = 177500000
InputFilter0.IF                 = -22080000;
InputFilter0.filter_type        = lowpass
InputFilter0.bw                 = 10000000
InputFilter0.tw                 = 5000000
InputFilter0.decimation_factor  = 10
;InputFilter0.dump              = true
;InputFilter0.dump_filename     = ./ion_raw_band0_Xlated.dat

; RF CHANNEL 1 -> extracts band at IF1
InputFilter1.implementation     = Freq_Xlating_Fir_Filter
InputFilter1.input_item_type    = byte
InputFilter1.output_item_type   = gr_complex
InputFilter1.taps_item_type     = float
InputFilter1.sampling_frequency = 177500000
InputFilter1.IF                 = -66050000
InputFilter1.filter_type        = lowpass
InputFilter1.bw                 = 10000000
InputFilter1.tw                 = 5000000
InputFilter1.decimation_factor  = 10
;InputFilter1.dump              = true
;InputFilter1.dump_filename     = ./ion_raw_band1_Xlated.dat

;######### RESAMPLER CONFIG ############
Resampler0.implementation = Pass_Through
Resampler1.implementation = Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
; Example: GPS L1 C/A on IF0, GPS L5 on IF1 - replace with your actual bands
Channels.in_acquisition = 8

Channels_1B.count = 10 ; Galileo E1
;Channels_5X.count = 10 ; Galileo E5a

Channels_1B.RF_channel_ID = 0
Channels_5X.RF_channel_ID = 1

Channel0.signal  = 1B
Channel1.signal  = 1B
Channel2.signal  = 1B
Channel3.signal  = 1B
Channel4.signal  = 1B
Channel5.signal  = 1B
Channel6.signal  = 1B
Channel7.signal  = 1B
Channel8.signal  = 1B
Channel9.signal  = 1B

Channel10.signal = 5X
Channel11.signal = 5X
Channel12.signal = 5X
Channel13.signal = 5X
Channel14.signal = 5X
Channel15.signal = 5X
Channel16.signal = 5X
Channel17.signal = 5X
Channel18.signal = 5X
Channel19.signal = 5X

;######### TRACKING GLOBAL CONFIG ############
Acquisition_1B.implementation                 = Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.item_type                      = gr_complex
Acquisition_1B.coherent_integration_time_ms   = 4
Acquisition_1B.doppler_max                    = 5000
Acquisition_1B.doppler_step                   = 125; * 1/2*T (3.8 dB max loss)
Acquisition_1B.max_dwells                     = 5; 20 ms incoherent accumulation
Acquisition_1B.pfa                            = 1e-8
;Acquisition_1B.dump                          = true
;Acquisition_1B.dump_mat                      = true
;Acquisition_1B.dump_filename                 = ./acq_galileoE1.dat

Acquisition_5X.implementation                 = Galileo_E5a_Pcps_Acquisition
Acquisition_5X.item_type                      = gr_complex
Acquisition_5X.coherent_integration_time_ms   = 1
Acquisition_5X.doppler_max                    = 5000
Acquisition_5X.doppler_step                   = 500; 1/2*T (3.8 dB max loss)
Acquisition_5X.max_dwells                     = 20; 20 ms incoherent accumulation
Acquisition_5X.pfa                            = 1e-8
Acquisition_5X.enable_doppler_narrowing       = true 
;Acquisition_5X.dump                          = true
;Acquisition_5X.dump_mat                      = true
;Acquisition_5X.dump_filename                 = ./acq_galileoE5a.dat

;######### TRACKING GLOBAL CONFIG ############
Tracking_1B.implementation                     = Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type                          = gr_complex
Tracking_1B.fll_bw_hz                          = 10.0
Tracking_1B.pll_bw_hz                          = 10.0
Tracking_1B.dll_bw_hz                          = 2.0
Tracking_1B.pll_bw_narrow_hz                   = 5.0
Tracking_1B.dll_bw_narrow_hz                   = 1.0
Tracking_1B.enable_fll_pull_in                 = true
Tracking_1B.enable_fll_steady_state            = false
Tracking_1B.track_pilot                        = true
Tracking_1B.carrier_aiding                     = true
Tracking_1B.early_late_space_chips             = 0.15
Tracking_1B.very_early_late_space_chips        = 0.6
Tracking_1B.very_early_late_space_narrow_chips = 0.30
Tracking_1B.extend_correlation_symbols         = 5
;Tracking_1B.f_error_step_num                   = 5
;Tracking_1B.f_error_accumulation               = 5; 20 ms
;Tracking_1B.f_error_doppler_step               = 125; (1/2T)
;Tracking_1B.enable_fll_atan2_pullin_test       = true
;Tracking_1B.dump                              = true
;Tracking_1B.dump_filename                     = trk_galileoE1_ch

Tracking_5X.implementation                     = Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.item_type                          = gr_complex
Tracking_5X.fll_bw_hz                          = 10.0
Tracking_5X.pll_bw_hz                          = 15.0
Tracking_5X.dll_bw_hz                          = 2.0
Tracking_5X.pll_bw_narrow_hz                   = 5.0
Tracking_5X.dll_bw_narrow_hz                   = 1.0
Tracking_5X.enable_fll_pull_in                 = true;
Tracking_5X.enable_fll_steady_state            = false
Tracking_5x.extend_correlation_symbols         = 20; extend to 20 ms

Tracking_5x.track_pilot                        = true
Tracking_1B.carrier_aiding                     = true

Tracking_5X.early_late_space_chips             = 0.5
;Tracking_5X.f_error_step_num                   = 5
;Tracking_5X.f_error_accumulation               = 20; 20 ms
;Tracking_5X.f_error_doppler_step               = 500; (1/2T)
;Tracking_5X.dump                              = true
;Tracking_5X.dump_filename                     = trk_GalileoE5a_ch

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1B.implementation = Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_5X.implementation = Galileo_E5a_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation = Hybrid_Observables
;Observables.dump          = true 

;######### PVT CONFIG ############
PVT.implementation           = RTKLIB_PVT
PVT.elevation_mask           = 5
PVT.num_bands                = 2
PVT.dynamics_model           = 0
PVT.raim_fde                 = 1
PVT.enable_pvt_kf            = true
PVT.output_rate_ms           = 1000
PVT.display_rate_ms          = 1000
PVT.output_enabled           = true
PVT.max_clock_offset_ms      = 100;
PVT.gpx_output_enabled       = false
PVT.geojson_output_enabled   = false
PVT.kml_output_enabled       = false
PVT.xml_output_enabled       = true; this enables ephemeris dump
PVT.nmea_output_file_enabled = false
PVT.rinexobs_rate_ms         = 1000
PVT.iono_model               = Broadcast
PVT.trop_model               = Saastamoinen
PVT.rinex_version            = 4
PVT.enable_monitor           = true
PVT.monitor_client_addresses = 127.0.0.1
PVT.monitor_udp_port         = 1111

;######### MONITOR CONFIG ############
Monitor.enable_monitor    = true
Monitor.decimation_factor = 50
Monitor.client_addresses  = 127.0.0.1
Monitor.udp_port          = 1112
